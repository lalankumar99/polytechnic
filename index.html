<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081b33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polytechnic Hub">
<link rel="manifest" href="./manifest.json">
<title>Polytechnic Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:Inter,Arial,sans-serif;
background:#f5f8fc;
color:#081b33
}

#app{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.loader{
width:100%;
max-width:420px;
text-align:center
}

.logo{
width:88px;
height:88px;
margin:auto;
border-radius:26px;
object-fit:cover;
box-shadow:0 18px 45px rgba(8,27,51,.2)
}

.brand{
margin-top:18px;
font-size:23px;
font-weight:900;
letter-spacing:.5px
}

.subtitle{
margin-top:7px;
font-size:13px;
color:#718096
}

.spinner{
width:32px;
height:32px;
margin:24px auto 0;
border:3px solid #dce5ef;
border-top-color:#1677ff;
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.install-overlay{
position:fixed;
inset:0;
display:flex;
align-items:flex-end;
justify-content:center;
padding:18px;
background:rgba(3,13,26,.45);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
opacity:0;
visibility:hidden;
transition:.3s;
z-index:100
}

.install-overlay.show{
opacity:1;
visibility:visible
}

.install-box{
width:100%;
max-width:460px;
background:rgba(255,255,255,.98);
border-radius:28px;
padding:22px;
box-shadow:0 25px 80px rgba(0,0,0,.28);
transform:translateY(40px);
transition:.4s cubic-bezier(.2,.8,.2,1)
}

.install-overlay.show .install-box{
transform:translateY(0)
}

.install-head{
display:flex;
align-items:center;
gap:14px
}

.install-logo{
width:58px;
height:58px;
border-radius:17px;
object-fit:cover;
box-shadow:0 10px 25px rgba(8,27,51,.18)
}

.install-title{
font-size:19px;
font-weight:900;
color:#081b33
}

.install-desc{
margin-top:5px;
font-size:13px;
line-height:1.5;
color:#718096
}

.install-features{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-top:18px
}

.feature{
padding:11px;
border-radius:14px;
background:#f3f7fc;
font-size:12px;
font-weight:700;
color:#334155
}

.actions{
display:flex;
gap:10px;
margin-top:18px
}

.action{
height:48px;
border:0;
border-radius:14px;
font-size:14px;
font-weight:800;
cursor:pointer;
transition:.2s
}

.action:active{
transform:scale(.96)
}

.install{
flex:1.3;
background:linear-gradient(135deg,#0b1f3a,#1677ff);
color:#fff;
box-shadow:0 10px 25px rgba(22,119,255,.25)
}

.browser{
flex:1;
background:#edf2f7;
color:#243b53
}

.close{
width:100%;
height:42px;
margin-top:9px;
border:0;
background:transparent;
color:#718096;
font-size:13px;
font-weight:700
}

.status{
display:none;
margin-top:16px;
padding:11px;
border-radius:12px;
background:#eef6ff;
color:#1677ff;
font-size:12px;
font-weight:700
}

@media(max-width:380px){
.install-box{
padding:18px
}

.install-features{
grid-template-columns:1fr
}

.brand{
font-size:20px
}
}
</style>
</head>

<body>

<div id="app">
<div class="loader">
<img class="logo" src="https://lalanview.vercel.app/Polytechnic%20Hub%2020261004_144919.jpg" alt="Polytechnic Hub">
<div class="brand">POLYTECHNIC HUB</div>
<div class="subtitle">Your Complete Polytechnic Learning Platform</div>
<div class="spinner"></div>
</div>
</div>

<div class="install-overlay" id="installOverlay">
<div class="install-box">

<div class="install-head">
<img class="install-logo" src="https://lalanview.vercel.app/Polytechnic%20Hub%2020261004_144919.jpg" alt="Polytechnic Hub">
<div>
<div class="install-title">Polytechnic Hub App</div>
<div class="install-desc">Install the app for a faster and better learning experience.</div>
</div>
</div>

<div class="install-features">
<div class="feature">⚡ Fast Access</div>
<div class="feature">📚 Study Material</div>
<div class="feature">📝 Online Tests</div>
<div class="feature">📱 App Experience</div>
</div>

<div class="actions">
<button class="action browser" id="browserBtn">Continue to Browser</button>
<button class="action install" id="installBtn">Install App</button>
</div>

<button class="close" id="closeBtn">Maybe Later</button>

<div class="status" id="status"></div>

</div>
</div>

<script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const overlay = document.getElementById("installOverlay");
const installBtn = document.getElementById("installBtn");
const browserBtn = document.getElementById("browserBtn");
const closeBtn = document.getElementById("closeBtn");
const status = document.getElementById("status");

let deferredPrompt = null;
let authReady = false;
let authUser = null;

const isStandalone = () => {
return window.matchMedia("(display-mode: standalone)").matches ||
window.navigator.standalone === true;
};

const showInstall = () => {
if(isStandalone()) return;
if(!deferredPrompt) return;
setTimeout(() => {
overlay.classList.add("show");
},500);
};

const hideInstall = () => {
overlay.classList.remove("show");
};

const continueBrowser = () => {
hideInstall();
};

window.addEventListener("beforeinstallprompt",event => {
event.preventDefault();
deferredPrompt = event;
showInstall();
});

installBtn.addEventListener("click",async() => {

if(!deferredPrompt){
status.style.display="block";
status.textContent="Install option is currently unavailable. Please use your browser menu to install the app.";
return;
}

const promptEvent = deferredPrompt;
deferredPrompt = null;

hideInstall();

try{
await promptEvent.prompt();
await promptEvent.userChoice;
}catch(error){
console.log(error);
}

});

browserBtn.addEventListener("click",continueBrowser);

closeBtn.addEventListener("click",continueBrowser);

window.addEventListener("appinstalled",() => {
deferredPrompt = null;
hideInstall();
});

if("serviceWorker" in navigator){
window.addEventListener("load",() => {
navigator.serviceWorker.register("./sw.js").catch(() => {});
});
}

onAuthStateChanged(auth,user => {

authUser = user;
authReady = true;

if(user){
setTimeout(() => {
window.location.replace("home.html");
},700);
}else{
setTimeout(() => {
if(!isStandalone() && deferredPrompt){
showInstall();
}else{
window.location.replace("login.html");
}
},700);
}

});

window.addEventListener("DOMContentLoaded",() => {

if(isStandalone()){
hideInstall();
}

});

</script>

</body>
</html>
