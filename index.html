<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A192F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polytechnic Hub">
<meta name="description" content="Polytechnic Hub - Complete learning platform for Polytechnic students.">
<link rel="manifest" href="./manifest.json">
<title>Polytechnic Hub</title>

<style>
:root{
  --navy:#0A192F;
  --blue:#2563EB;
  --blue2:#3B82F6;
  --bg:#F5F8FC;
  --white:#FFFFFF;
  --text:#172033;
  --muted:#64748B;
  --border:#E2E8F0;
  --shadow:0 12px 35px rgba(10,25,47,.16);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  background:var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}

.install-notification{
  position:fixed;
  left:50%;
  bottom:calc(16px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);
  max-width:440px;
  padding:16px;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(226,232,240,.9);
  border-radius:22px;
  box-shadow:var(--shadow);
  z-index:9999;
  opacity:0;
  visibility:hidden;
  transform:translate(-50%,30px) scale(.97);
  transition:
    opacity .35s ease,
    visibility .35s ease,
    transform .4s cubic-bezier(.2,.8,.2,1);
}

.install-notification.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0) scale(1);
}

.install-top{
  display:flex;
  align-items:center;
  gap:13px;
}

.install-logo{
  width:54px;
  height:54px;
  flex:0 0 54px;
  padding:3px;
  border-radius:16px;
  background:#fff;
  box-shadow:0 6px 18px rgba(10,25,47,.12);
  overflow:hidden;
}

.install-logo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:13px;
}

.install-content{
  min-width:0;
}

.install-title{
  font-size:16px;
  line-height:1.2;
  font-weight:800;
  color:var(--navy);
}

.install-description{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}

.install-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:14px;
}

.install-button{
  min-height:44px;
  border:0;
  border-radius:13px;
  padding:0 12px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  transition:transform .18s ease,background .18s ease;
}

.install-button:active{
  transform:scale(.96);
}

.install-app{
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  box-shadow:0 7px 18px rgba(37,99,235,.25);
}

.continue-browser{
  color:#334155;
  background:#F1F5F9;
  border:1px solid var(--border);
}

.install-button:disabled{
  opacity:.65;
  cursor:default;
}

@media(max-width:350px){
  .install-notification{
    padding:13px;
    border-radius:19px;
  }

  .install-logo{
    width:48px;
    height:48px;
    flex-basis:48px;
  }

  .install-title{
    font-size:15px;
  }

  .install-description{
    font-size:11px;
  }

  .install-actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="install-notification" id="installNotification">
  <div class="install-top">
    <div class="install-logo">
      <img
        src="https://lalanview.vercel.app/Polytechnic%20Hub%2020261004_144919.jpg"
        alt="Polytechnic Hub">
    </div>

    <div class="install-content">
      <div class="install-title">Install Polytechnic Hub</div>
      <div class="install-description">
        ऐप इंस्टॉल करें और Polytechnic Hub को तेज़ और बेहतर तरीके से इस्तेमाल करें।
      </div>
    </div>
  </div>

  <div class="install-actions">
    <button class="install-button install-app" id="installButton">
      Install App
    </button>

    <button class="install-button continue-browser" id="browserButton">
      Continue to Browser
    </button>
  </div>
</div>

<script type="module">
import { auth } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const installNotification = document.getElementById("installNotification");
const installButton = document.getElementById("installButton");
const browserButton = document.getElementById("browserButton");

let deferredPrompt = null;
let installNotificationVisible = false;
let authReady = false;
let currentUser = null;
let userChoiceMade = false;

function isStandalone() {
  return (
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true
  );
}

function showInstallNotification() {
  if (isStandalone()) return;
  if (!deferredPrompt) return;
  if (installNotificationVisible) return;

  installNotificationVisible = true;

  setTimeout(() => {
    installNotification.classList.add("show");
  }, 650);
}

function hideInstallNotification() {
  installNotification.classList.remove("show");
  installNotificationVisible = false;
}

function redirectUser() {
  if (!authReady || !userChoiceMade) return;

  if (currentUser) {
    window.location.replace("./home.html");
  } else {
    window.location.replace("./login.html");
  }
}

function continueWithoutInstalling() {
  userChoiceMade = true;
  deferredPrompt = null;
  hideInstallNotification();
  redirectUser();
}

window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();

  if (isStandalone()) {
    return;
  }

  deferredPrompt = event;
  showInstallNotification();
});

installButton.addEventListener("click", async () => {
  if (!deferredPrompt) {
    continueWithoutInstalling();
    return;
  }

  const promptEvent = deferredPrompt;

  installButton.disabled = true;

  try {
    await promptEvent.prompt();

    const result = await promptEvent.userChoice;

    deferredPrompt = null;
    hideInstallNotification();

    installButton.disabled = false;
    userChoiceMade = true;

    if (result && result.outcome === "accepted") {
      redirectUser();
      return;
    }

    redirectUser();
  } catch (error) {
    deferredPrompt = null;
    installButton.disabled = false;
    hideInstallNotification();
    userChoiceMade = true;
    redirectUser();
  }
});

browserButton.addEventListener("click", () => {
  continueWithoutInstalling();
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  hideInstallNotification();
  userChoiceMade = true;
  redirectUser();
});

onAuthStateChanged(auth, user => {
  currentUser = user;
  authReady = true;

  if (isStandalone()) {
    userChoiceMade = true;
    redirectUser();
    return;
  }

  if (!deferredPrompt) {
    setTimeout(() => {
      if (!installNotificationVisible) {
        userChoiceMade = true;
        redirectUser();
      }
    }, 900);
  }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && isStandalone()) {
    hideInstallNotification();

    if (authReady) {
      userChoiceMade = true;
      redirectUser();
    }
  }
});
</script>

</body>
</html>
