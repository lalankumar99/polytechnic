<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLYTECHNIC HUB - Login</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --navy: #0A192F;
  --blue: #2563EB;
  --blue-hover: #1D4ED8;
  --light-bg: #F8FAFC;
  --white: #FFFFFF;
  --text-main: #1E293B;
  --text-muted: #64748B;
  --error: #EF4444;
  --border: #E2E8F0;
  --focus-ring: rgba(37, 99, 235, 0.2);
  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(255, 255, 255, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, sans-serif;
}

body {
  background-color: var(--light-bg);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

.layout {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

.left-panel {
  flex: 1;
  background: linear-gradient(135deg, var(--navy) 0%, #172a45 100%);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 3rem;
  color: var(--white);
  position: relative;
  overflow: hidden;
}

.left-panel::before {
  content: '';
  position: absolute;
  top: -20%;
  left: -10%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(37,99,235,0.2) 0%, rgba(10,25,47,0) 70%);
  border-radius: 50%;
}

.left-panel::after {
  content: '';
  position: absolute;
  bottom: -20%;
  right: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(10,25,47,0) 70%);
  border-radius: 50%;
}

.brand-visual {
  z-index: 1;
  text-align: center;
  max-width: 400px;
}

.brand-logo-large {
  width: 80px;
  height: 80px;
  background: var(--blue);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 2rem;
  box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
}

.brand-visual h1 {
  font-size: 2.5rem;
  font-weight: 800;
  margin-bottom: 1rem;
  letter-spacing: -0.02em;
}

.brand-visual p {
  font-size: 1.125rem;
  color: #94A3B8;
  line-height: 1.6;
}

.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  position: relative;
}

.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 2.5rem;
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
}

.mobile-logo {
  display: none;
  width: 48px;
  height: 48px;
  background: var(--blue);
  border-radius: 12px;
  align-items: center;
  justify-content: center;
  margin-bottom: 2rem;
}

.auth-header {
  margin-bottom: 2rem;
}

.auth-header h2 {
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  color: var(--navy);
}

.auth-header p {
  color: var(--text-muted);
  font-size: 0.95rem;
}

.form-group {
  position: relative;
  margin-bottom: 1.25rem;
}

.form-control {
  width: 100%;
  padding: 1.1rem 1rem 0.5rem 3rem;
  font-size: 1rem;
  color: var(--text-main);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  transition: all 0.2s ease;
}

.form-control:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 4px var(--focus-ring);
}

.form-label {
  position: absolute;
  left: 3rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  transition: all 0.2s ease;
  font-size: 1rem;
}

.form-control:focus ~ .form-label,
.form-control:not(:placeholder-shown) ~ .form-label {
  top: 0.4rem;
  transform: translateY(0);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--blue);
}

select.form-control {
  padding-top: 1.1rem;
  padding-bottom: 0.5rem;
  appearance: none;
}

select.form-control:invalid {
  color: var(--text-muted);
}

.input-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 20px;
  height: 20px;
  transition: color 0.2s ease;
}

.form-control:focus ~ .input-icon {
  color: var(--blue);
}

.toggle-password {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  padding: 0;
  display: flex;
}

.toggle-password:hover {
  color: var(--text-main);
}

.forgot-password {
  display: block;
  text-align: right;
  font-size: 0.875rem;
  color: var(--blue);
  text-decoration: none;
  margin-top: -0.5rem;
  margin-bottom: 1.5rem;
  font-weight: 500;
}

.forgot-password:hover {
  text-decoration: underline;
}

.btn {
  width: 100%;
  padding: 0.875rem;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  transition: all 0.2s ease;
  border: none;
}

.btn-primary {
  background: var(--blue);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
}

.btn-primary:hover:not(:disabled) {
  background: var(--blue-hover);
  transform: translateY(-1px);
}

.btn-primary:disabled {
  background: #93C5FD;
  cursor: not-allowed;
}

.divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 1.5rem 0;
  color: var(--text-muted);
  font-size: 0.875rem;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid var(--border);
}

.divider:not(:empty)::before {
  margin-right: 1rem;
}

.divider:not(:empty)::after {
  margin-left: 1rem;
}

.btn-google {
  background: var(--white);
  color: var(--text-main);
  border: 1px solid var(--border);
}

.btn-google:hover:not(:disabled) {
  background: #F8FAFC;
  border-color: #CBD5E1;
}

.switch-form {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.95rem;
  color: var(--text-muted);
}

.switch-form a {
  color: var(--blue);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

.switch-form a:hover {
  text-decoration: underline;
}

.secure-badge {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
}

.alert {
  padding: 0.75rem 1rem;
  border-radius: 8px;
  font-size: 0.875rem;
  margin-bottom: 1.5rem;
  display: none;
  font-weight: 500;
}

.alert-error {
  background: #FEF2F2;
  color: #B91C1C;
  border: 1px solid #FCA5A5;
}

.alert-success {
  background: #F0FDF4;
  color: #15803D;
  border: 1px solid #86EFAC;
}

.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: var(--white);
  animation: spin 0.8s linear infinite;
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#register-section {
  display: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}

#login-section {
  transition: opacity 0.3s ease;
}

@media (min-width: 768px) {
  .left-panel {
    display: flex;
  }
}

@media (max-width: 767px) {
  .auth-card {
    padding: 2rem 1.5rem;
    border: none;
    box-shadow: none;
    background: transparent;
  }
  .mobile-logo {
    display: flex;
  }
  .right-panel {
    padding: 0;
    align-items: flex-start;
    background: var(--white);
  }
}
</style>
</head>
<body>
<div class="layout">
  <div class="left-panel">
    <div class="brand-visual">
      <div class="brand-logo-large">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
      </div>
      <h1>POLYTECHNIC HUB</h1>
      <p>Your complete digital campus. Access resources, connect with peers, and accelerate your engineering journey.</p>
    </div>
  </div>

  <div class="right-panel">
    <div class="auth-card">
      <div class="mobile-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
      </div>

      <div class="auth-header">
        <h2 id="auth-title">Welcome Back</h2>
        <p id="auth-subtitle">Sign in to continue your learning journey</p>
      </div>

      <div id="alert-box" class="alert"></div>

      <div id="login-section">
        <form id="login-form">
          <div class="form-group">
            <input type="email" id="login-email" class="form-control" placeholder=" " required>
            <label class="form-label">Email Address</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </div>
          
          <div class="form-group">
            <input type="password" id="login-password" class="form-control" placeholder=" " required>
            <label class="form-label">Password</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <button type="button" class="toggle-password" onclick="togglePassword('login-password')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>

          <a href="#" class="forgot-password" id="forgot-password-btn">Forgot Password?</a>

          <button type="submit" class="btn btn-primary" id="login-submit">
            <span class="spinner" id="login-spinner"></span>
            <span id="login-btn-text">Sign In</span>
          </button>
        </form>
      </div>

      <div id="register-section">
        <form id="register-form">
          <div class="form-group">
            <input type="text" id="reg-name" class="form-control" placeholder=" " required>
            <label class="form-label">Full Name</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>

          <div class="form-group">
            <input type="email" id="reg-email" class="form-control" placeholder=" " required>
            <label class="form-label">Email Address</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </div>

          <div class="form-group">
            <select id="reg-branch" class="form-control" required>
              <option value="" disabled selected hidden></option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Electrical Engineering">Electrical Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Computer Science Engineering">Computer Science Engineering</option>
              <option value="Electronics Engineering">Electronics Engineering</option>
              <option value="Automobile Engineering">Automobile Engineering</option>
            </select>
            <label class="form-label">Select Branch</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          </div>

          <div class="form-group">
            <input type="password" id="reg-password" class="form-control" placeholder=" " required minlength="6">
            <label class="form-label">Password</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <button type="button" class="toggle-password" onclick="togglePassword('reg-password')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>

          <button type="submit" class="btn btn-primary" id="reg-submit">
            <span class="spinner" id="reg-spinner"></span>
            <span id="reg-btn-text">Create Account</span>
          </button>
        </form>
      </div>

      <div class="divider">OR</div>

      <button type="button" class="btn btn-google" id="google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>

      <div class="switch-form" id="switch-container">
        Don't have an account? <a id="show-register">Create Account</a>
      </div>

      <div class="secure-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        Secure Firebase Authentication
      </div>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword, 
  GoogleAuthProvider, 
  signInWithPopup, 
  sendPasswordResetEmail, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { 
  doc, 
  setDoc, 
  getDoc, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const loginSection = document.getElementById('login-section');
const registerSection = document.getElementById('register-section');
const showRegisterBtn = document.getElementById('show-register');
const switchContainer = document.getElementById('switch-container');
const authTitle = document.getElementById('auth-title');
const authSubtitle = document.getElementById('auth-subtitle');
const alertBox = document.getElementById('alert-box');

const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const forgotPasswordBtn = document.getElementById('forgot-password-btn');
const googleBtn = document.getElementById('google-btn');

let currentMode = 'login';
let isProcessing = false;

onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("home.html");
  }
});

window.togglePassword = function(inputId) {
  const input = document.getElementById(inputId);
  if (input.type === "password") {
    input.type = "text";
  } else {
    input.type = "password";
  }
};

function showMessage(msg, type = 'error') {
  alertBox.textContent = msg;
  alertBox.className = `alert alert-${type}`;
  alertBox.style.display = 'block';
}

function clearMessage() {
  alertBox.style.display = 'none';
  alertBox.textContent = '';
}

function getErrorMessage(code) {
  switch(code) {
    case 'auth/invalid-credential': return "Incorrect email or password.";
    case 'auth/email-already-in-use': return "This email is already registered.";
    case 'auth/weak-password': return "Password should be at least 6 characters.";
    case 'auth/invalid-email': return "Please enter a valid email address.";
    case 'auth/popup-closed-by-user': return "Google sign-in was cancelled.";
    default: return "An error occurred. Please try again.";
  }
}

function setLoading(isLoading, buttonId, textId, spinnerId, defaultText, loadingText) {
  isProcessing = isLoading;
  const btn = document.getElementById(buttonId);
  const text = document.getElementById(textId);
  const spinner = document.getElementById(spinnerId);
  
  btn.disabled = isLoading;
  if (isLoading) {
    text.textContent = loadingText;
    spinner.style.display = 'inline-block';
  } else {
    text.textContent = defaultText;
    spinner.style.display = 'none';
  }
}

showRegisterBtn.addEventListener('click', () => {
  clearMessage();
  if (currentMode === 'login') {
    currentMode = 'register';
    loginSection.style.opacity = '0';
    setTimeout(() => {
      loginSection.style.display = 'none';
      registerSection.style.display = 'block';
      setTimeout(() => registerSection.style.opacity = '1', 50);
      authTitle.textContent = "Create Account";
      authSubtitle.textContent = "Join Polytechnic Hub and start learning";
      switchContainer.innerHTML = `Already have an account? <a id="show-login">Sign In</a>`;
      document.getElementById('show-login').addEventListener('click', toggleBackToLogin);
    }, 300);
  }
});

function toggleBackToLogin() {
  clearMessage();
  currentMode = 'login';
  registerSection.style.opacity = '0';
  setTimeout(() => {
    registerSection.style.display = 'none';
    loginSection.style.display = 'block';
    setTimeout(() => loginSection.style.opacity = '1', 50);
    authTitle.textContent = "Welcome Back";
    authSubtitle.textContent = "Sign in to continue your learning journey";
    switchContainer.innerHTML = `Don't have an account? <a id="show-register">Create Account</a>`;
    document.getElementById('show-register').addEventListener('click', () => document.getElementById('show-register').click());
  }, 300);
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (isProcessing) return;
  
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  
  clearMessage();
  setLoading(true, 'login-submit', 'login-btn-text', 'login-spinner', 'Sign In', 'Signing in...');
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    showMessage(getErrorMessage(error.code));
    setLoading(false, 'login-submit', 'login-btn-text', 'login-spinner', 'Sign In', 'Signing in...');
  }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (isProcessing) return;
  
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const branch = document.getElementById('reg-branch').value;
  const password = document.getElementById('reg-password').value;
  
  clearMessage();
  setLoading(true, 'reg-submit', 'reg-btn-text', 'reg-spinner', 'Create Account', 'Creating account...');
  
  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    await setDoc(doc(db, "students", user.uid), {
      uid: user.uid,
      name: name,
      email: user.email,
      branch: branch,
      photoURL: "",
      createdAt: serverTimestamp()
    });
    
  } catch (error) {
    showMessage(getErrorMessage(error.code));
    setLoading(false, 'reg-submit', 'reg-btn-text', 'reg-spinner', 'Create Account', 'Creating account...');
  }
});

googleBtn.addEventListener('click', async () => {
  if (isProcessing) return;
  
  clearMessage();
  const provider = new GoogleAuthProvider();
  googleBtn.disabled = true;
  document.getElementById('google-btn-text').textContent = 'Connecting...';
  
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    
    const docRef = doc(db, "students", user.uid);
    const docSnap = await getDoc(docRef);
    
    if (!docSnap.exists()) {
      await setDoc(docRef, {
        uid: user.uid,
        name: user.displayName || "Student",
        email: user.email || "",
        branch: "",
        photoURL: user.photoURL || "",
        createdAt: serverTimestamp()
      });
    }
  } catch (error) {
    showMessage(getErrorMessage(error.code));
    googleBtn.disabled = false;
    document.getElementById('google-btn-text').textContent = 'Continue with Google';
  }
});

forgotPasswordBtn.addEventListener('click', async (e) => {
  e.preventDefault();
  if (isProcessing) return;
  
  const email = document.getElementById('login-email').value;
  clearMessage();
  
  if (!email) {
    showMessage("Enter your email first.");
    document.getElementById('login-email').focus();
    return;
  }
  
  try {
    await sendPasswordResetEmail(auth, email);
    showMessage("Password reset email sent.", "success");
  } catch (error) {
    showMessage(getErrorMessage(error.code));
  }
});
</script>
