<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>Polytechnic Hub - Admin Dashboard</title>

<style>
:root{
--navy:#0B1F3A;
--navy2:#08172B;
--blue:#1677FF;
--blue2:#2563EB;
--bg:#F5F8FC;
--white:#FFFFFF;
--text:#172033;
--muted:#6B7280;
--border:#E5E7EB;
--green:#16A34A;
--green-bg:#F0FDF4;
--red:#DC2626;
--red-bg:#FEF2F2;
--orange:#D97706;
--orange-bg:#FFFBEB;
--shadow:0 10px 30px rgba(11,31,58,.08);
--safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:var(--bg);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}

button,input{
font:inherit;
}

button{
cursor:pointer;
}

.header{
height:64px;
position:sticky;
top:0;
z-index:100;
background:rgba(255,255,255,.96);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
}

.header-left{
display:flex;
align-items:center;
gap:12px;
}

.header-title{
font-size:1.08rem;
font-weight:850;
color:var(--navy);
}

.header-subtitle{
font-size:.68rem;
color:var(--muted);
margin-top:1px;
}

.logo{
width:38px;
height:38px;
border-radius:11px;
object-fit:cover;
}

.header-right{
display:flex;
align-items:center;
gap:8px;
}

.icon-btn{
width:40px;
height:40px;
border:0;
border-radius:11px;
background:#F1F5F9;
color:var(--navy);
display:flex;
align-items:center;
justify-content:center;
}

.icon-btn:active{
transform:scale(.94);
}

.main{
width:100%;
max-width:1400px;
margin:0 auto;
padding:22px 16px 40px;
}

.hero{
background:linear-gradient(135deg,var(--navy),#163B70);
border-radius:22px;
padding:22px;
color:white;
box-shadow:var(--shadow);
margin-bottom:20px;
}

.hero-title{
font-size:1.35rem;
font-weight:850;
}

.hero-text{
margin-top:6px;
font-size:.82rem;
opacity:.78;
line-height:1.5;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:18px;
}

.stat{
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.12);
border-radius:15px;
padding:13px;
}

.stat-label{
font-size:.7rem;
opacity:.72;
}

.stat-value{
margin-top:4px;
font-size:1.35rem;
font-weight:850;
}

.toolbar{
background:var(--white);
border:1px solid var(--border);
border-radius:18px;
padding:13px;
box-shadow:var(--shadow);
margin-bottom:18px;
}

.search-wrap{
position:relative;
}

.search{
width:100%;
height:46px;
border:1px solid var(--border);
border-radius:12px;
background:#F8FAFC;
padding:0 14px 0 43px;
outline:none;
font-size:.88rem;
color:var(--text);
}

.search:focus{
border-color:var(--blue);
box-shadow:0 0 0 4px rgba(22,119,255,.1);
background:white;
}

.search-icon{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
color:#94A3B8;
pointer-events:none;
}

.filter-row{
display:flex;
gap:7px;
margin-top:11px;
overflow-x:auto;
scrollbar-width:none;
}

.filter-row::-webkit-scrollbar{
display:none;
}

.filter-btn{
border:1px solid var(--border);
background:white;
color:var(--muted);
padding:8px 13px;
border-radius:10px;
font-size:.76rem;
font-weight:750;
white-space:nowrap;
}

.filter-btn.active{
background:var(--blue);
border-color:var(--blue);
color:white;
}

.students-grid{
display:grid;
grid-template-columns:1fr;
gap:13px;
}

.student-card{
background:white;
border:1px solid var(--border);
border-radius:18px;
padding:15px;
box-shadow:var(--shadow);
}

.student-top{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:52px;
height:52px;
border-radius:15px;
object-fit:cover;
background:linear-gradient(135deg,var(--navy),var(--blue));
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:1rem;
font-weight:850;
flex-shrink:0;
}

.student-main{
min-width:0;
flex:1;
}

.student-name{
font-size:.95rem;
font-weight:850;
color:var(--navy);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.student-email{
font-size:.76rem;
color:var(--muted);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:3px;
}

.status{
display:inline-flex;
align-items:center;
gap:5px;
margin-top:7px;
font-size:.66rem;
font-weight:800;
padding:4px 8px;
border-radius:999px;
}

.status.active{
background:var(--green-bg);
color:var(--green);
}

.status.blocked{
background:var(--red-bg);
color:var(--red);
}

.student-info{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px;
}

.info-box{
background:#F8FAFC;
border-radius:11px;
padding:9px;
min-width:0;
}

.info-label{
font-size:.62rem;
color:#94A3B8;
font-weight:700;
}

.info-value{
font-size:.74rem;
font-weight:750;
color:var(--text);
margin-top:3px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.student-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:13px;
}

.action-btn{
height:40px;
border-radius:10px;
border:1px solid var(--border);
font-size:.76rem;
font-weight:800;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
}

.view-btn{
background:#EFF6FF;
color:var(--blue);
border-color:#DBEAFE;
}

.block-btn{
background:var(--orange-bg);
color:var(--orange);
border-color:#FDE68A;
}

.block-btn.unblock{
background:var(--green-bg);
color:var(--green);
border-color:#BBF7D0;
}

.delete-btn{
background:var(--red-bg);
color:var(--red);
border-color:#FECACA;
grid-column:1/-1;
}

.empty{
display:none;
background:white;
border:1px dashed #CBD5E1;
border-radius:20px;
padding:45px 20px;
text-align:center;
color:var(--muted);
}

.empty.show{
display:block;
}

.empty-title{
font-size:1.05rem;
font-weight:850;
color:var(--navy);
margin-bottom:6px;
}

.empty-text{
font-size:.8rem;
line-height:1.5;
}

.loading{
background:white;
border:1px solid var(--border);
border-radius:18px;
padding:25px;
text-align:center;
color:var(--muted);
font-size:.82rem;
}

.error{
display:none;
background:var(--red-bg);
border:1px solid #FECACA;
border-radius:15px;
padding:14px;
color:var(--red);
font-size:.8rem;
margin-bottom:15px;
}

.error.show{
display:block;
}

.modal{
position:fixed;
inset:0;
z-index:300;
background:rgba(2,8,23,.55);
display:none;
align-items:flex-end;
justify-content:center;
padding:12px;
}

.modal.show{
display:flex;
}

.modal-card{
width:100%;
max-width:520px;
max-height:90vh;
overflow-y:auto;
background:white;
border-radius:24px;
padding:20px;
box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.modal-title{
font-size:1.05rem;
font-weight:850;
color:var(--navy);
}

.close-btn{
width:36px;
height:36px;
border:0;
border-radius:10px;
background:#F1F5F9;
color:var(--navy);
display:flex;
align-items:center;
justify-content:center;
}

.profile{
text-align:center;
padding-bottom:18px;
border-bottom:1px solid var(--border);
}

.profile-avatar{
width:82px;
height:82px;
border-radius:22px;
object-fit:cover;
background:linear-gradient(135deg,var(--navy),var(--blue));
color:white;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 10px;
font-size:1.5rem;
font-weight:900;
}

.profile-name{
font-size:1.15rem;
font-weight:850;
color:var(--navy);
}

.profile-email{
font-size:.78rem;
color:var(--muted);
margin-top:4px;
}

.details{
margin-top:16px;
display:grid;
gap:10px;
}

.detail{
padding:12px;
background:#F8FAFC;
border-radius:12px;
}

.detail-label{
font-size:.66rem;
color:#94A3B8;
font-weight:700;
}

.detail-value{
font-size:.82rem;
font-weight:750;
color:var(--text);
margin-top:3px;
word-break:break-word;
}

.modal-actions{
display:grid;
gap:9px;
margin-top:18px;
}

.modal-btn{
height:44px;
border:0;
border-radius:12px;
font-weight:800;
font-size:.82rem;
}

.modal-block{
background:var(--orange-bg);
color:var(--orange);
}

.modal-unblock{
background:var(--green-bg);
color:var(--green);
}

.modal-delete{
background:var(--red-bg);
color:var(--red);
}

.bottom-space{
height:20px;
}

@media(min-width:650px){
.main{
padding-left:24px;
padding-right:24px;
}

.students-grid{
grid-template-columns:repeat(2,1fr);
}

.stats{
grid-template-columns:repeat(4,1fr);
}
}

@media(min-width:1000px){
.students-grid{
grid-template-columns:repeat(3,1fr);
}

.modal{
align-items:center;
}
}

@media(min-width:1350px){
.students-grid{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<script type="module">
import { auth, db } from "./firebase.js";

import {
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
collection,
getDocs,
doc,
getDoc,
setDoc,
deleteDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const ADMIN_EMAIL =
"lalankumar@electrical.com";

const studentsGrid =
document.getElementById("students-grid");

const loading =
document.getElementById("loading");

const empty =
document.getElementById("empty");

const errorBox =
document.getElementById("error-box");

const searchInput =
document.getElementById("search-input");

const refreshButton =
document.getElementById("refresh-btn");

const logoutButton =
document.getElementById("logout-btn");

const modal =
document.getElementById("student-modal");

const modalContent =
document.getElementById("modal-content");

const closeModal =
document.getElementById("close-modal");

const totalCount =
document.getElementById("total-count");

const activeCount =
document.getElementById("active-count");

const blockedCount =
document.getElementById("blocked-count");

const branchCount =
document.getElementById("branch-count");

const filterButtons =
document.querySelectorAll(".filter-btn");

let currentUser = null;
let students = [];
let currentFilter = "all";
let selectedStudent = null;
let loadingStudents = false;

function escapeHTML(value) {
return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function escapeAttribute(value) {
return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll('"',"&quot;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll("'","&#039;");
}

function getInitials(name) {
const value =
String(name || "Student")
.trim();

if (!value) {
return "ST";
}

const words =
value.split(/\s+/);

if (words.length === 1) {
return words[0]
.substring(0,2)
.toUpperCase();
}

return (
words[0][0] +
words[words.length - 1][0]
).toUpperCase();
}

function getDate(value) {
if (!value) {
return "—";
}

try {
if (
typeof value.toDate ===
"function"
) {
return value.toDate()
.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);
}

return new Date(value)
.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

} catch {
return "—";
}
}

function normalizeStudent(id,data) {
return {
uid:id,
name:
data.name ||
"Student",
email:
data.email ||
"—",
branch:
data.branch ||
"Not selected",
photoURL:
data.photoURL ||
"",
active:
data.active !== false,
createdAt:
data.createdAt || null
};
}

function showError(message) {
errorBox.textContent =
message;

errorBox.classList.add(
"show"
);
}

function hideError() {
errorBox.textContent = "";
errorBox.classList.remove(
"show"
);
}

async function verifyAdmin(user) {
if (!user) {
return false;
}

if (
user.email?.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
) {
return false;
}

const adminRef =
doc(db,"admins",user.uid);

const adminSnapshot =
await getDoc(adminRef);

if (!adminSnapshot.exists()) {
return false;
}

const data =
adminSnapshot.data();

return (
data.role === "admin" &&
data.active !== false &&
data.email?.toLowerCase() ===
ADMIN_EMAIL.toLowerCase()
);
}

async function loadStudents() {
if (
loadingStudents ||
!currentUser
) {
return;
}

loadingStudents = true;

loading.style.display =
"block";

studentsGrid.innerHTML = "";

empty.classList.remove(
"show"
);

hideError();

try {

const studentsRef =
collection(db,"students");

const snapshot =
await getDocs(
studentsRef
);

students = [];

snapshot.forEach(
item => {

const data =
item.data();

students.push(
normalizeStudent(
item.id,
data
)
);

}
);

students.sort(
(a,b) =>
String(a.name)
.localeCompare(
String(b.name),
undefined,
{
sensitivity:"base"
}
)
);

updateStats();

renderStudents();

} catch(error) {

console.error(
"Students loading error:",
error
);

showError(
error.code ===
"permission-denied"
? "Firestore permission denied. Admin rules check करें।"
: "Students load नहीं हो सके। Firebase connection check करें।"
);

} finally {

loadingStudents.style.display =
"none";

loadingStudents = false;

}
}

function updateStats() {

const total =
students.length;

const active =
students.filter(
student =>
student.active
).length;

const blocked =
students.filter(
student =>
!student.active
).length;

const branches =
new Set(
students
.map(
student =>
student.branch
)
.filter(
branch =>
branch &&
branch !==
"Not selected"
)
);

totalCount.textContent =
total;

activeCount.textContent =
active;

blockedCount.textContent =
blocked;

branchCount.textContent =
branches.size;
}

function getFilteredStudents() {

const search =
searchInput.value
.trim()
.toLowerCase();

return students.filter(
student => {

const matchesSearch =
!search ||
student.name
.toLowerCase()
.includes(search) ||
student.email
.toLowerCase()
.includes(search) ||
student.branch
.toLowerCase()
.includes(search) ||
student.uid
.toLowerCase()
.includes(search);

const matchesFilter =
currentFilter === "all" ||
(
currentFilter ===
"active" &&
student.active
) ||
(
currentFilter ===
"blocked" &&
!student.active
);

return (
matchesSearch &&
matchesFilter
);

}
);
}

function renderStudents() {

studentsGrid.innerHTML = "";

const filtered =
getFilteredStudents();

if (
filtered.length === 0
) {

empty.classList.add(
"show"
);

return;
}

empty.classList.remove(
"show"
);

filtered.forEach(
student => {

const card =
document.createElement(
"article"
);

card.className =
"student-card";

const avatar =
student.photoURL
? `
<img
class="avatar"
src="${escapeAttribute(student.photoURL)}"
alt="Student"
referrerpolicy="no-referrer"
>
`
: `
<div class="avatar">
${escapeHTML(
getInitials(
student.name
)
)}
</div>
`;

card.innerHTML = `

<div class="student-top">

${avatar}

<div class="student-main">

<div class="student-name">
${escapeHTML(
student.name
)}
</div>

<div class="student-email">
${escapeHTML(
student.email
)}
</div>

<div class="status ${
student.active
? "active"
: "blocked"
}">

<span>
${student.active
? "●"
: "●"}
</span>

${student.active
? "Active"
: "Blocked"}

</div>

</div>

</div>

<div class="student-info">

<div class="info-box">

<div class="info-label">
Branch
</div>

<div class="info-value">
${escapeHTML(
student.branch
)}
</div>

</div>

<div class="info-box">

<div class="info-label">
Joined
</div>

<div class="info-value">
${escapeHTML(
getDate(
student.createdAt
)
)}
</div>

</div>

</div>

<div class="student-actions">

<button
class="action-btn view-btn"
data-action="view"
data-uid="${escapeAttribute(student.uid)}"
>
View Details
</button>

<button
class="action-btn block-btn ${
student.active
? ""
: "unblock"
}"
data-action="block"
data-uid="${escapeAttribute(student.uid)}"
>
${
student.active
? "Block"
: "Unblock"
}
</button>

<button
class="action-btn delete-btn"
data-action="delete"
data-uid="${escapeAttribute(student.uid)}"
>
Delete Student
</button>

</div>
`;

studentsGrid.appendChild(card);

}
);
}

</div>

</div>

Branch

Account Status

modal.classList.add(
"show"
);

document
.getElementById(
"modal-block-btn"
)
.addEventListener(
"click",
async () => {

await toggleStudentStatus(
student
);

}
);

document
.getElementById(
"modal-delete-btn"
)
.addEventListener(
"click",
async () => {

await deleteStudent(
student
);

}
);
}

async function toggleStudentStatus(
student
) {

if (!student) {
return;
}

const action =
student.active
? "block"
: "unblock";

const confirmed =
window.confirm(
student.active
? `क्या आप ${student.name} को block करना चाहते हैं?`
: `क्या आप ${student.name} को unblock करना चाहते हैं?`
);

if (!confirmed) {
return;
}

try {

const studentRef =
doc(
db,
"students",
student.uid
);

await setDoc(
studentRef,
{
active:
!student.active,
updatedAt:
serverTimestamp()
},
{
merge:true
}
);

student.active =
!student.active;

updateStats();

renderStudents();

if (
selectedStudent?.uid ===
student.uid
) {
openStudentModal(
student
);
}

} catch(error) {

console.error(
"Block/unblock error:",
error
);

alert(
"Student status update नहीं हो सका।"
);

}
}

async function deleteStudent(
student
) {

if (!student) {
return;
}

const firstConfirm =
window.confirm(
`${student.name} को delete करना है?`
);

if (!firstConfirm) {
return;
}

const secondConfirm =
window.confirm(
"यह Firestore से student profile और उसके purchased course assignments हटाएगा। क्या आप सच में जारी रखना चाहते हैं?"
);

if (!secondConfirm) {
return;
}

try {

const studentRef =
doc(
db,
"students",
student.uid
);

const coursesRef =
collection(
db,
"students",
student.uid,
"purchasedCourses"
);

const coursesSnapshot =
await getDocs(
coursesRef
);

for (
const courseDoc
of coursesSnapshot.docs
) {

await deleteDoc(
courseDoc.ref
);

}

await deleteDoc(
studentRef
);

students =
students.filter(
item =>
item.uid !==
student.uid
);

selectedStudent = null;

modal.classList.remove(
"show"
);

updateStats();

renderStudents();

} catch(error) {

console.error(
"Delete student error:",
error
);

alert(
"Student delete नहीं हो सका। Firestore permissions check करें।"
);

}
}

studentsGrid.addEventListener(
"click",
event => {

const button =
event.target.closest(
"[data-action]"
);

if (!button) {
return;
}

const uid =
button.dataset.uid;

const action =
button.dataset.action;

const student =
students.find(
item =>
item.uid === uid
);

if (!student) {
return;
}

if (action === "view") {
openStudentModal(
student
);
}

if (action === "block") {
toggleStudentStatus(
student
);
}

if (action === "delete") {
deleteStudent(
student
);
}

}
);

"input",
renderStudents
);

filterButtons.forEach(
button => {

button.addEventListener(
"click",
() => {

filterButtons.forEach(
item =>
item.classList.remove(
"active"
)
);

button.classList.add(
"active"
);

currentFilter =
button.dataset.filter ||
"all";

renderStudents();

}
);

}
);

refreshButton.addEventListener(
"click",
async () => {

refreshButton.disabled =
true;

await loadStudents();

refreshButton.disabled =
false;

}
);

closeModal.addEventListener(
"click",
() => {

modal.classList.remove(
"show"
);

selectedStudent = null;

}
);

modal.addEventListener(
"click",
event => {

if (
event.target === modal
) {

modal.classList.remove(
"show"
);

selectedStudent = null;

}

}
);

document.addEventListener(
"keydown",
event => {

if (
event.key === "Escape"
) {

modal.classList.remove(
"show"
);

selectedStudent = null;

}

}
);

logoutButton.addEventListener(
"click",
async () => {

const confirmed =
window.confirm(
"Admin logout करना चाहते हैं?"
);

if (!confirmed) {
return;
}

try {

await signOut(auth);

window.location.replace(
"./adminlogin.html"
);

} catch {

alert(
"Logout failed. Please try again."
);

}

}
);

onAuthStateChanged(
auth,
async user => {

if (!user) {

window.location.replace(
"./adminlogin.html"
);

return;
}

currentUser = user;

try {

const allowed =
await verifyAdmin(
user
);

if (!allowed) {

await signOut(auth);

window.location.replace(
"./adminlogin.html"
);

return;
}

await loadStudents();

} catch(error) {

console.error(
"Admin verification error:",
error
);

await signOut(auth);

window.location.replace(
"./adminlogin.html"
);

}

}
);

window.addEventListener(
"focus",
async () => {

if (
currentUser &&
!loadingStudents
) {

await loadStudents();

}

}
);
</script>
