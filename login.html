<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A192F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>POLYTECHNIC HUB - Login</title>

<style>
:root{
  --navy:#0A192F;
  --blue:#2563EB;
  --blue-hover:#1D4ED8;
  --light-bg:#F8FAFC;
  --white:#FFFFFF;
  --text-main:#1E293B;
  --text-muted:#64748B;
  --border:#E2E8F0;
  --focus-ring:rgba(37,99,235,.2);
  --glass-bg:rgba(255,255,255,.88);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:var(--light-bg);
  color:var(--text-main);
  min-height:100vh;
  overflow-x:hidden;
}

.layout{
  display:flex;
  width:100%;
  min-height:100vh;
}

.left-panel{
  flex:1;
  background:linear-gradient(135deg,#0A192F,#172A45);
  display:none;
  justify-content:center;
  align-items:center;
  padding:3rem;
  color:#fff;
  position:relative;
  overflow:hidden;
}

.left-panel:before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  top:-20%;
  left:-10%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.22),transparent 70%);
}

.left-panel:after{
  content:"";
  position:absolute;
  width:600px;
  height:600px;
  right:-15%;
  bottom:-25%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.15),transparent 70%);
}

.brand-visual{
  z-index:1;
  text-align:center;
  max-width:430px;
}

.brand-logo-large{
  width:90px;
  height:90px;
  margin:0 auto 25px;
  border-radius:24px;
  overflow:hidden;
  background:#fff;
  padding:4px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.brand-logo-large img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:20px;
}

.brand-visual h1{
  font-size:2.5rem;
  font-weight:800;
  margin-bottom:15px;
  letter-spacing:-.03em;
}

.brand-visual p{
  color:#94A3B8;
  font-size:1.05rem;
  line-height:1.7;
}

.right-panel{
  flex:1;
  min-width:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.auth-card{
  width:100%;
  max-width:440px;
  background:var(--glass-bg);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.5);
  border-radius:25px;
  padding:40px;
  box-shadow:0 25px 60px rgba(10,25,47,.08);
}

.mobile-logo{
  display:flex;
  width:58px;
  height:58px;
  padding:3px;
  margin-bottom:25px;
  border-radius:17px;
  background:#fff;
  box-shadow:0 8px 25px rgba(10,25,47,.12);
}

.mobile-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:14px;
}

.auth-header{
  margin-bottom:25px;
}

.auth-header h2{
  color:var(--navy);
  font-size:28px;
  font-weight:800;
  margin-bottom:7px;
}

.auth-header p{
  color:var(--text-muted);
  font-size:14px;
  line-height:1.5;
}

.alert{
  display:none;
  padding:12px 14px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  margin-bottom:18px;
}

.alert-error{
  background:#FEF2F2;
  color:#B91C1C;
  border:1px solid #FCA5A5;
}

.alert-success{
  background:#F0FDF4;
  color:#15803D;
  border:1px solid #86EFAC;
}

.form-group{
  position:relative;
  margin-bottom:17px;
}

.form-control{
  width:100%;
  height:58px;
  padding:20px 45px 7px 48px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  color:var(--text-main);
  font-size:15px;
  outline:none;
  transition:.2s;
}

.form-control:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px var(--focus-ring);
}

.form-label{
  position:absolute;
  left:48px;
  top:50%;
  transform:translateY(-50%);
  color:var(--text-muted);
  pointer-events:none;
  transition:.2s;
  font-size:14px;
}

.form-control:focus~.form-label,
.form-control:not(:placeholder-shown)~.form-label{
  top:8px;
  transform:none;
  font-size:10px;
  font-weight:700;
  color:var(--blue);
}

.input-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
  color:#64748B;
  pointer-events:none;
}

.form-control:focus~.input-icon{
  color:var(--blue);
}

select.form-control{
  padding-top:20px;
  padding-bottom:7px;
  appearance:none;
}

.toggle-password{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:#64748B;
  cursor:pointer;
  display:flex;
}

.forgot-password{
  display:block;
  text-align:right;
  color:var(--blue);
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  margin:-5px 0 18px;
}

.btn{
  width:100%;
  min-height:50px;
  border:0;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.btn-primary{
  background:var(--blue);
  color:#fff;
  box-shadow:0 8px 20px rgba(37,99,235,.2);
}

.btn-primary:hover:not(:disabled){
  background:var(--blue-hover);
  transform:translateY(-1px);
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.divider{
  display:flex;
  align-items:center;
  gap:14px;
  margin:22px 0;
  color:#94A3B8;
  font-size:12px;
  font-weight:700;
}

.divider:before,
.divider:after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border);
}

.btn-google{
  background:#fff;
  color:#1E293B;
  border:1px solid var(--border);
}

.btn-google:hover:not(:disabled){
  background:#F8FAFC;
  border-color:#CBD5E1;
}

.switch-form{
  text-align:center;
  margin-top:22px;
  color:var(--text-muted);
  font-size:14px;
}

.switch-form a{
  color:var(--blue);
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
}

.secure-badge{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  margin-top:25px;
  color:#94A3B8;
  font-size:11px;
}

.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:none;
}

.google-spinner{
  width:18px;
  height:18px;
  border:2px solid #CBD5E1;
  border-top-color:#2563EB;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:none;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#register-section{
  display:none;
}

@media(min-width:768px){
  .left-panel{
    display:flex;
  }
}

@media(max-width:767px){
  .right-panel{
    min-height:100vh;
    padding:15px;
    align-items:center;
    background:#fff;
  }

  .auth-card{
    padding:25px 10px;
    background:transparent;
    border:0;
    box-shadow:none;
  }

  .mobile-logo{
    display:flex;
  }
}

@media(max-width:380px){
  .auth-card{
    padding:20px 5px;
  }

  .auth-header h2{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="layout">

  <div class="left-panel">
    <div class="brand-visual">
      <div class="brand-logo-large">
        <img src="https://lalanview.vercel.app/Polytechnic%20Hub%2020261004_144919.jpg" alt="Polytechnic Hub">
      </div>
      <h1>POLYTECHNIC HUB</h1>
      <p>Your complete digital campus for Polytechnic students. Learn, practice and grow with one powerful platform.</p>
    </div>
  </div>

  <div class="right-panel">
    <div class="auth-card">

      <div class="mobile-logo">
        <img src="https://lalanview.vercel.app/Polytechnic%20Hub%2020261004_144919.jpg" alt="Polytechnic Hub">
      </div>

      <div class="auth-header">
        <h2 id="auth-title">Welcome Back</h2>
        <p id="auth-subtitle">Sign in to continue your learning journey</p>
      </div>

      <div id="alert-box" class="alert"></div>

      <div id="login-section">

        <form id="login-form">

          <div class="form-group">
            <input type="email" id="login-email" class="form-control" placeholder=" " autocomplete="email" required>
            <label class="form-label">Email Address</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>

          <div class="form-group">
            <input type="password" id="login-password" class="form-control" placeholder=" " autocomplete="current-password" required>
            <label class="form-label">Password</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <button type="button" class="toggle-password" data-target="login-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <a href="#" class="forgot-password" id="forgot-password-btn">Forgot Password?</a>

          <button type="submit" class="btn btn-primary" id="login-submit">
            <span class="spinner" id="login-spinner"></span>
            <span id="login-btn-text">Sign In</span>
          </button>

        </form>

      </div>

      <div id="register-section">

        <form id="register-form">

          <div class="form-group">
            <input type="text" id="reg-name" class="form-control" placeholder=" " autocomplete="name" required>
            <label class="form-label">Full Name</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>

          <div class="form-group">
            <input type="email" id="reg-email" class="form-control" placeholder=" " autocomplete="email" required>
            <label class="form-label">Email Address</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>

          <div class="form-group">
            <select id="reg-branch" class="form-control" required>
              <option value="" disabled selected>Select Branch</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Electrical Engineering">Electrical Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Computer Science Engineering">Computer Science Engineering</option>
              <option value="Electronics Engineering">Electronics Engineering</option>
              <option value="Automobile Engineering">Automobile Engineering</option>
            </select>
            <label class="form-label">Select Branch</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>

          <div class="form-group">
            <input type="password" id="reg-password" class="form-control" placeholder=" " autocomplete="new-password" minlength="6" required>
            <label class="form-label">Password</label>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <button type="button" class="toggle-password" data-target="reg-password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <button type="submit" class="btn btn-primary" id="reg-submit">
            <span class="spinner" id="reg-spinner"></span>
            <span id="reg-btn-text">Create Account</span>
          </button>

        </form>

      </div>

      <div class="divider">OR</div>

      <button type="button" class="btn btn-google" id="google-btn">
        <span id="google-icon">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </span>
        <span class="google-spinner" id="google-spinner"></span>
        <span id="google-btn-text">Continue with Google</span>
      </button>

      <div class="switch-form" id="switch-container">
        Don't have an account?
        <a id="show-register">Create Account</a>
      </div>

      <div class="secure-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Secure Firebase Authentication
      </div>

    </div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  doc,
  setDoc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const loginSection = document.getElementById("login-section");
const registerSection = document.getElementById("register-section");
const switchContainer = document.getElementById("switch-container");
const authTitle = document.getElementById("auth-title");
const authSubtitle = document.getElementById("auth-subtitle");
const alertBox = document.getElementById("alert-box");

const loginForm = document.getElementById("login-form");
const registerForm = document.getElementById("register-form");
const forgotPasswordBtn = document.getElementById("forgot-password-btn");
const googleBtn = document.getElementById("google-btn");

let currentMode = "login";
let isProcessing = false;
let authResolved = false;
let redirecting = false;

function redirectHome() {
  if (redirecting) return;
  redirecting = true;
  window.location.replace("./home.html");
}

onAuthStateChanged(auth, user => {
  authResolved = true;

  if (user) {
    redirectHome();
  }
});

document.querySelectorAll(".toggle-password").forEach(button => {
  button.addEventListener("click", () => {
    const input = document.getElementById(button.dataset.target);
    input.type = input.type === "password" ? "text" : "password";
  });
});

function showMessage(message, type = "error") {
  alertBox.textContent = message;
  alertBox.className = `alert alert-${type}`;
  alertBox.style.display = "block";
}

function clearMessage() {
  alertBox.style.display = "none";
  alertBox.textContent = "";
}

function getErrorMessage(code) {
  const errors = {
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/invalid-login-credentials": "Incorrect email or password.",
    "auth/user-not-found": "No account found with this email.",
    "auth/wrong-password": "Incorrect email or password.",
    "auth/email-already-in-use": "This email is already registered.",
    "auth/weak-password": "Password should be at least 6 characters.",
    "auth/invalid-email": "Please enter a valid email address.",
    "auth/popup-closed-by-user": "Google sign-in was cancelled.",
    "auth/popup-blocked": "Google popup was blocked. Please allow popups and try again.",
    "auth/cancelled-popup-request": "Google sign-in was cancelled.",
    "auth/account-exists-with-different-credential": "This email is already registered with another sign-in method.",
    "auth/network-request-failed": "Network error. Please check your internet connection.",
    "auth/too-many-requests": "Too many attempts. Please try again later."
  };

  return errors[code] || "Something went wrong. Please try again.";
}

function setButtonLoading(button, loading, spinner, text, loadingText, normalText) {
  button.disabled = loading;
  spinner.style.display = loading ? "block" : "none";
  text.textContent = loading ? loadingText : normalText;
}

function switchToRegister() {
  clearMessage();

  currentMode = "register";

  loginSection.style.display = "none";
  registerSection.style.display = "block";

  authTitle.textContent = "Create Account";
  authSubtitle.textContent = "Join Polytechnic Hub and start learning";

  switchContainer.innerHTML = `
    Already have an account?
    <a id="show-login">Sign In</a>
  `;

  document.getElementById("show-login").addEventListener("click", switchToLogin);
}

function switchToLogin() {
  clearMessage();

  currentMode = "login";

  registerSection.style.display = "none";
  loginSection.style.display = "block";

  authTitle.textContent = "Welcome Back";
  authSubtitle.textContent = "Sign in to continue your learning journey";

  switchContainer.innerHTML = `
    Don't have an account?
    <a id="show-register">Create Account</a>
  `;

  document.getElementById("show-register").addEventListener("click", switchToRegister);
}

document.getElementById("show-register").addEventListener("click", switchToRegister);

loginForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (isProcessing) return;

  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;

  clearMessage();

  isProcessing = true;

  const button = document.getElementById("login-submit");
  const spinner = document.getElementById("login-spinner");
  const text = document.getElementById("login-btn-text");

  setButtonLoading(
    button,
    true,
    spinner,
    text,
    "Signing in...",
    "Sign In"
  );

  try {
    await signInWithEmailAndPassword(auth, email, password);
    redirectHome();
  } catch (error) {
    showMessage(getErrorMessage(error.code));
  } finally {
    isProcessing = false;

    if (!redirecting) {
      setButtonLoading(
        button,
        false,
        spinner,
        text,
        "Signing in...",
        "Sign In"
      );
    }
  }
});

registerForm.addEventListener("submit", async event => {
  event.preventDefault();

  if (isProcessing) return;

  const name = document.getElementById("reg-name").value.trim();
  const email = document.getElementById("reg-email").value.trim();
  const branch = document.getElementById("reg-branch").value;
  const password = document.getElementById("reg-password").value;

  if (!name) {
    showMessage("Please enter your full name.");
    return;
  }

  if (!branch) {
    showMessage("Please select your branch.");
    return;
  }

   if (password.length < 6) {
    showMessage("Password should be at least 6 characters.");
    return;
  }

  clearMessage();

  isProcessing = true;

  const button = document.getElementById("reg-submit");
  const spinner = document.getElementById("reg-spinner");
  const text = document.getElementById("reg-btn-text");

  setButtonLoading(
    button,
    true,
    spinner,
    text,
    "Creating account...",
    "Create Account"
  );

  try {
    const credential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = credential.user;

    await setDoc(
      doc(db, "students", user.uid),
      {
        uid: user.uid,
        name: name,
        email: user.email || email,
        branch: branch,
        photoURL: user.photoURL || "",
        createdAt: serverTimestamp()
      },
      {
        merge: true
      }
    );

    showMessage("Account created successfully.", "success");

    setTimeout(() => {
      redirectHome();
    }, 400);

  } catch (error) {
    showMessage(getErrorMessage(error.code));

    isProcessing = false;

    setButtonLoading(
      button,
      false,
      spinner,
      text,
      "Creating account...",
      "Create Account"
    );
  }
});

googleBtn.addEventListener("click", async () => {
  if (isProcessing) return;

  clearMessage();

  isProcessing = true;

  const googleSpinner = document.getElementById("google-spinner");
  const googleIcon = document.getElementById("google-icon");
  const googleText = document.getElementById("google-btn-text");

  googleBtn.disabled = true;
  googleSpinner.style.display = "block";
  googleIcon.style.display = "none";
  googleText.textContent = "Connecting to Google...";

  try {
    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });

    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const studentRef = doc(db, "students", user.uid);
    const studentSnapshot = await getDoc(studentRef);

    if (!studentSnapshot.exists()) {
      await setDoc(studentRef, {
        uid: user.uid,
        name: user.displayName || "Student",
        email: user.email || "",
        branch: "",
        photoURL: user.photoURL || "",
        createdAt: serverTimestamp()
      });
    } else {
      const existingData = studentSnapshot.data();

      const updateData = {};

      if (!existingData.name && user.displayName) {
        updateData.name = user.displayName;
      }

      if (!existingData.email && user.email) {
        updateData.email = user.email;
      }

      if (!existingData.photoURL && user.photoURL) {
        updateData.photoURL = user.photoURL;
      }

      if (Object.keys(updateData).length > 0) {
        await setDoc(studentRef, updateData, { merge: true });
      }
    }

    redirectHome();

  } catch (error) {
    showMessage(getErrorMessage(error.code));
    isProcessing = false;

    googleBtn.disabled = false;
    googleSpinner.style.display = "none";
    googleIcon.style.display = "inline-flex";
    googleText.textContent = "Continue with Google";
  }
});

forgotPasswordBtn.addEventListener("click", async event => {
  event.preventDefault();

  if (isProcessing) return;

  const email = document.getElementById("login-email").value.trim();

  if (!email) {
    showMessage("Please enter your email address first.");
    document.getElementById("login-email").focus();
    return;
  }

  clearMessage();

  try {
    await sendPasswordResetEmail(auth, email);

    showMessage(
      "Password reset email sent. Please check your inbox.",
      "success"
    );
  } catch (error) {
    showMessage(getErrorMessage(error.code));
  }
});
</script>
