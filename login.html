<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignIn & SignUp | Polytechnic Hub</title>
  <link rel="stylesheet" type="text/css" href="./style.css" />
  <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="container">

    <div class="forms-container">
      <div class="signin-signup">

        <form action="" class="sign-in-form">
          <h2 class="title">Sign In</h2>

          <div class="input-field">
            <i class="fas fa-user"></i>
            <input
              type="email"
              placeholder="Username"
              autocomplete="username"
              required
            />
          </div>

          <div class="input-field">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
          </div>

          <input type="submit" value="Login" class="btn solid" />

          <p class="social-text">Or Sign in with social platforms</p>

          <div class="social-media">
            <a href="#" class="social-icon">
              <i class="fab fa-facebook-f"></i>
            </a>

            <a href="#" class="social-icon">
              <i class="fab fa-twitter"></i>
            </a>

            <a href="#" class="social-icon">
              <i class="fab fa-google"></i>
            </a>

            <a href="#" class="social-icon">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </div>
        </form>

        <form action="" class="sign-up-form">
          <h2 class="title">Sign Up</h2>

          <div class="input-field">
            <i class="fas fa-user"></i>
            <input
              type="text"
              placeholder="Username"
              autocomplete="name"
              required
            />
          </div>

          <div class="input-field">
            <i class="fas fa-envelope"></i>
            <input
              type="email"
              placeholder="Email"
              autocomplete="email"
              required
            />
          </div>

          <div class="input-field">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              placeholder="Password"
              autocomplete="new-password"
              required
            />
          </div>

          <input type="submit" value="Sign Up" class="btn solid" />

          <p class="social-text">Or Sign up with social platforms</p>

          <div class="social-media">
            <a href="#" class="social-icon">
              <i class="fab fa-facebook-f"></i>
            </a>

            <a href="#" class="social-icon">
              <i class="fab fa-twitter"></i>
            </a>

            <a href="#" class="social-icon">
              <i class="fab fa-google"></i>
            </a>

            <a href="#" class="social-icon">
              <i class="fab fa-linkedin-in"></i>
            </a>
          </div>
        </form>

      </div>
    </div>

    <div class="panels-container">

      <div class="panel left-panel">
        <div class="content">
          <h3>New here?</h3>
          <p>
            Join Polytechnic Hub and access your Polytechnic learning dashboard.
          </p>

          <button class="btn transparent" id="sign-up-btn" type="button">
            Sign Up
          </button>
        </div>

        <img src="./img/log.svg" class="image" alt="" />
      </div>

      <div class="panel right-panel">
        <div class="content">
          <h3>One of us?</h3>
          <p>
            Sign in to continue your Polytechnic learning journey.
          </p>

          <button class="btn transparent" id="sign-in-btn" type="button">
            Sign In
          </button>
        </div>

        <img src="./img/register.svg" class="image" alt="" />
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkoGGaTDkgnbQTGwqwO_Ktq6-LcWm8fig",
      authDomain: "polytechnic-hub-eb25b.firebaseapp.com",
      projectId: "polytechnic-hub-eb25b",
      storageBucket: "polytechnic-hub-eb25b.firebasestorage.app",
      messagingSenderId: "496226915082",
      appId: "1:496226915082:web:efd70f15161c61c17c20f3",
      measurementId: "G-D78LLY62C1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const signInButton = document.querySelector("#sign-in-btn");
    const signUpButton = document.querySelector("#sign-up-btn");
    const container = document.querySelector(".container");

    signUpButton.addEventListener("click", () => {
      container.classList.add("sign-up-mode");
    });

    signInButton.addEventListener("click", () => {
      container.classList.remove("sign-up-mode");
    });

    const signInForm = document.querySelector(".sign-in-form");

    signInForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const inputs = signInForm.querySelectorAll("input");

      const email = inputs[0].value.trim();
      const password = inputs[1].value;
      const loginButton = signInForm.querySelector(".btn");

      if (!email || !password) {
        alert("Please enter your email and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.value = "Signing In...";

      try {
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        window.location.href = "home.html";
      } catch (error) {
        let message = "Login failed. Please try again.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password"
        ) {
          message = "Incorrect email or password.";
        } else if (error.code === "auth/user-not-found") {
          message = "No account found with this email.";
        } else if (error.code === "auth/invalid-email") {
          message = "Please enter a valid email address.";
        } else if (error.code === "auth/too-many-requests") {
          message = "Too many login attempts. Please try again later.";
        } else if (error.code === "auth/network-request-failed") {
          message = "Network error. Please check your internet connection.";
        }

        alert(message);

        loginButton.disabled = false;
        loginButton.value = "Login";
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "home.html";
      }
    });
  </script>
</body>
  </html>
