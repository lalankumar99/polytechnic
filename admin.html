<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f8fc}
body{min-height:100vh}
.admin-bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:76px;
padding:8px 10px calc(8px + env(safe-area-inset-bottom));
background:rgba(255,255,255,.96);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-top:1px solid rgba(11,31,58,.1);
display:flex;
align-items:center;
justify-content:space-around;
z-index:9999;
box-shadow:0 -8px 30px rgba(11,31,58,.08)
}
.admin-nav-item{
border:0;
background:transparent;
text-decoration:none;
color:#718096;
height:58px;
min-width:90px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
border-radius:16px;
transition:.2s ease;
cursor:pointer;
-webkit-tap-highlight-color:transparent
}
.admin-nav-item:active{transform:scale(.94)}
.admin-nav-icon{
width:25px;
height:25px;
display:flex;
align-items:center;
justify-content:center
}
.admin-nav-icon svg{
width:23px;
height:23px;
stroke:currentColor;
stroke-width:2;
fill:none;
stroke-linecap:round;
stroke-linejoin:round
}
.admin-nav-label{
font-size:11px;
font-weight:700;
white-space:nowrap
}
.admin-nav-item.active{
color:#1677ff;
background:#edf5ff
}
</style>
</head>

<body>

<nav class="admin-bottom" id="adminBottom" style="display:none">

<a class="admin-nav-item" href="admincourses.html">
<span class="admin-nav-icon">
<svg viewBox="0 0 24 24">
<path d="M12 5v14"/>
<path d="M5 12h14"/>
<rect x="3" y="3" width="18" height="18" rx="4"/>
</svg>
</span>
<span class="admin-nav-label">Add Course</span>
</a>

<a class="admin-nav-item" href="admindashboard.html">
<span class="admin-nav-icon">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="7" height="7" rx="1"/>
<rect x="14" y="3" width="7" height="7" rx="1"/>
<rect x="3" y="14" width="7" height="7" rx="1"/>
<rect x="14" y="14" width="7" height="7" rx="1"/>
</svg>
</span>
<span class="admin-nav-label">Dashboard</span>
</a>

<a class="admin-nav-item" href="adminnotification.html">
<span class="admin-nav-icon">
<svg viewBox="0 0 24 24">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M10 21h4"/>
</svg>
</span>
<span class="admin-nav-label">Notification</span>
</a>

</nav>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const ADMIN_EMAIL = "lalankumar@electrical.com";
const adminBottom = document.getElementById("adminBottom");

onAuthStateChanged(auth, async user => {
  if (!user) {
    location.replace("adminlogin.html");
    return;
  }

  if ((user.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    await signOut(auth);
    location.replace("adminlogin.html");
    return;
  }

  try {
    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    if (!adminSnap.exists()) {
      await signOut(auth);
      location.replace("adminlogin.html");
      return;
    }

    const adminData = adminSnap.data();

    if (
      adminData.role !== "admin" ||
      adminData.active !== true ||
      (adminData.email || "").toLowerCase() !== ADMIN_EMAIL.toLowerCase()
    ) {
      await signOut(auth);
      location.replace("adminlogin.html");
      return;
    }

    adminBottom.style.display = "flex";

    const currentPage = location.pathname.split("/").pop();

    document.querySelectorAll(".admin-nav-item").forEach(item => {
      const page = item.getAttribute("href");

      if (page === currentPage) {
        item.classList.add("active");
      }
    });

  } catch (error) {
    await signOut(auth);
    location.replace("adminlogin.html");
  }
});
</script>

</body>
  </html>
